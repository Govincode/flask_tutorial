{% extends "base.html" %}
{% block content %}

{% with messages = get_flashed_messages(with_categories = true) %}
{% if  messages%}
{% for category,message in messages %}

<div class="alert theme-{{category}}" role="alert">
  <p>{{ message }}!</p>
  <p>{{ size }}</p>
</div>

{% endfor %}
{% endif %}
{% endwith %}
{% endblock %}
