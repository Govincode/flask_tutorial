{% extends "base.html" %}
{% block content %}
<h1>Contact Us</h1>
<form class="row gx-3 gy-2 align-items-center" method="POST" action="/Contact">
  <div class="sm:col-3">
    <label class="visually-hidden" for="specificSizeInputName">Name</label>
    <input name="fullname" type="text" class="form-control" id="specificSizeInputName" placeholder="Jane Doe">
  </div>
  <div class="sm:col-3">
    <label class="visually-hidden" for="specificSizeInputGroupUsername">Username</label>
    <div class="input-group">
      <div class="input-group-text">@</div>
      <input name="username" type="text" class="form-control" id="specificSizeInputGroupUsername" placeholder="Username">
    </div>
  </div>
  <div class="sm:col-3">
    <label class="visually-hidden" for="specificSizeSelect">Preference</label>
    <select name="sizes" class="form-control" id="specificSizeSelect">
      <option selected>Choose...</option>
      <option value="1">One</option>
      <option value="2">Two</option>
      <option value="3">Three</option>
    </select>
  </div>
  <div class="col-auto">
    <div class="form-field">
      <input type="checkbox" id="autoSizingCheck2" class="check">
      <label for="autoSizingCheck2">
        Remember me
      </label>
    </div>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn-solid theme-primary">Submit</button>
  </div>
</form>


<div>
    <label for="">Full Name : </label>
    <input type="text" name="fullname" id="fullname" value="{{fullname}}">
    <hr>
    <br>
    <label for="">UserName : </label>
    <input type="text" name="username" id="username" value="{{username}}">
    <hr>
    <br>
    <label for="">Size : </label>
    <input type="text" name="size" id="size" value="{{specificSize}}">
</div>
{% endblock %}
